appId: com.zhanghuanyang.yptd
productName: yptd
copyright: Antai Feng
directories:
  output: release
  buildResources: build
# 两种产物同名规则：yptd-0.3.0-arm64.dmg / .zip，latest-mac.yml 里指的就是那个 zip
artifactName: ${productName}-${version}-${arch}.${ext}
files:
  - out/**
  - package.json
  # 只装这台机器用得上的原生二进制：koffi 和 OpenIM 核心各带了五六个平台的构建，
  # 全带上 app 大 150MB，签名还要一个个打时间戳。
  - "!node_modules/koffi/build/koffi/{darwin_x64,freebsd_arm64,freebsd_ia32,freebsd_x64,linux_arm32hf,linux_arm64,linux_ia32,linux_riscv64hf64,linux_x64,openbsd_ia32,openbsd_x64,win32_arm64,win32_ia32,win32_x64}/**"
  - "!node_modules/koffi/{src,doc,examples,test,vendor}/**"
  - "!node_modules/@openim/electron-client-sdk/assets/{linux_arm64,linux_x64,mac_x64,win_x64}/**"
# OpenIM 的 Go 核心是一个 dylib，koffi 是加载它的 .node；两者不能在 asar 里，要解出来一起签名、公证。
asarUnpack:
  - node_modules/@openim/electron-client-sdk/assets/mac_arm64/**
  - node_modules/koffi/build/koffi/darwin_arm64/**
mac:
  category: public.app-category.social-networking
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: '14.0'
  notarize: true
dmg:
  contents:
    - x: 150
      y: 200
    - x: 450
      y: 200
      type: link
      path: /Applications
  window:
    width: 600
    height: 380
publish:
  provider: generic
  url: https://im.zhanghuanyang.com/dl/desktop/
