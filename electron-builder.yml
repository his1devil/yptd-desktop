appId: com.zhanghuanyang.yptd
productName: yptd
copyright: Antai Feng
directories:
  output: release
  buildResources: build
# 两种产物同名规则：yptd-0.3.0-arm64.dmg / .zip，latest-mac.yml 里指的就是那个 zip
artifactName: ${productName}-${version}-${arch}.${ext}
files:
  - out/**
  - package.json
  # 只装 Mac 用得上的原生二进制：koffi 和 OpenIM 核心各带了五六个平台的构建。
  # 两个 Mac 架构都留着，打包完由 build/afterPack.cjs 按目标架构删掉另一个。
  - "!node_modules/koffi/build/koffi/{freebsd_arm64,freebsd_ia32,freebsd_x64,linux_arm32hf,linux_arm64,linux_ia32,linux_riscv64hf64,linux_x64,openbsd_ia32,openbsd_x64,win32_arm64,win32_ia32,win32_x64}/**"
  - "!node_modules/koffi/{src,doc,examples,test,vendor}/**"
  - "!node_modules/@openim/electron-client-sdk/assets/{linux_arm64,linux_x64,win_x64}/**"
# OpenIM 的 Go 核心是一个 dylib，koffi 是加载它的 .node；两者不能在 asar 里，要解出来一起签名、公证。
asarUnpack:
  - node_modules/@openim/electron-client-sdk/assets/mac_arm64/**
  - node_modules/@openim/electron-client-sdk/assets/mac_x64/**
  - node_modules/koffi/build/koffi/darwin_arm64/**
  - node_modules/koffi/build/koffi/darwin_x64/**
# 打完包、签名前：删掉另一个架构的原生库
afterPack: build/afterPack.cjs
mac:
  category: public.app-category.social-networking
  icon: build/icon.icns
  # Apple 芯片和 Intel 各出一份 dmg + zip；latest-mac.yml 同时列出两边，
  # electron-updater 按机器架构挑。
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: '14.0'
  notarize: true
dmg:
  # 两个图标是眼睛，背景里那条弧线箭头是嘴——整个安装窗口是一张笑脸。
  # 背景由 scripts/make-dmg-background.py 生成，tiff 里同时装了 1x 和 2x。
  # 注意：这里只负责把图拷进卷里。electron-builder 写的背景别名现在的 Finder 不认，
  # 真正让它显示出来的是打包后跑的 scripts/dmg-finish.sh。
  background: build/dmg-background.tiff
  iconSize: 120
  iconTextSize: 13
  contents:
    - x: 150
      y: 150
    - x: 450
      y: 150
      type: link
      path: /Applications
  window:
    width: 600
    height: 380
publish:
  provider: generic
  url: https://im.zhanghuanyang.com/dl/desktop/
